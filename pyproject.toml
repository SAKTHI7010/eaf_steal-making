[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eaf-control-model"
version = "1.0.0"
description = "Static & dynamic control model for Electric Arc Furnace (EAF) steelmaking, with operator guidance, sensitivity analysis and a desktop GUI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib",
    "numpy",
]
# NOTE: the GUI also needs tkinter, which is NOT a pip package. It ships with
# most Python installs; on Debian/Ubuntu install the system package:
#     sudo apt-get install python3-tk

[project.scripts]
eaf-gui = "eaf_control_model.gui:main"
eaf-cli = "eaf_control_model.cli:run"

[tool.setuptools]
# Explicitly list the package so setuptools does not try to auto-discover the
# loose top-level scripts (run_demo.py, sensitivity_analysis.py).
packages = ["eaf_control_model"]
